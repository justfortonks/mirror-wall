# Mirror Wall Cast for iPhone. Generate the Xcode project with `xcodegen` in this folder; the
# .xcodeproj is not kept in git. The app picks a slot; the broadcast upload extension captures the
# screen and speaks Mirror Wall Cast (docs/mirror-wall-cast.md), linking MirrorCore from the
# repository's Swift package so the protocol is defined once for the Mac, Android and iPhone.
name: MirrorWallCast
options:
  bundleIdPrefix: com.justfortonks.mirrorwall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: T6K8527TV3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  MirrorWall:
    path: ..
targets:
  MirrorWallCast:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: MirrorWall
        product: MirrorCore
      - target: Broadcast
        embed: true
    entitlements:
      path: App/MirrorWallCast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justfortonks.mirrorwall.cast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justfortonks.mirrorwall.cast
        PRODUCT_NAME: Mirror Wall Cast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mirror Wall Cast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Fraunces-Bold.ttf]
        NSCameraUsageDescription: Mirror Wall Cast uses the camera to scan the QR code Mirror Wall shows, so it knows where to share your screen.
        NSLocalNetworkUsageDescription: Mirror Wall Cast looks for Mirror Wall on your network and sends your screen to it.
        NSBonjourServices: [_mirrorwall._tcp]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.justfortonks.mirrorwall.cast.connect
            CFBundleURLSchemes: [mirrorwall]
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    dependencies:
      - package: MirrorWall
        product: MirrorCore
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justfortonks.mirrorwall.cast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justfortonks.mirrorwall.cast.broadcast
        PRODUCT_NAME: Mirror Wall Cast Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Mirror Wall Cast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
