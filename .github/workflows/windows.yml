# Builds Mirror Wall for Windows: the receiver (uxplay and GStreamer, in MSYS2), then the app and
# its installer. The installer is attached to each run as "MirrorWall-Setup". The release workflow
# (release.yml) runs this too and attaches the installer to the release.
name: Windows

on:
  push:
    paths: ['windows/**', 'patches/**', 'Sources/MirrorWall/Resources/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'patches/**', 'Sources/MirrorWall/Resources/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      beta:
        description: The beta number, when building a test build for the Beta update channel
        type: string
        default: ""

# A newer push replaces a run still going on the same branch.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The receiver only changes with its build script or the patches, so most runs reuse it.
      - id: cache
        uses: actions/cache@v4
        with:
          path: windows/receiver/out
          key: receiver-${{ hashFiles('windows/receiver/**', 'patches/**') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            cmake:p gcc:p ninja:p libplist:p openssl:p gstreamer:p gst-plugins-base:p
            gst-plugins-good:p gst-plugins-bad:p gst-libav:p

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build uxplay
        shell: msys2 {0}
        run: bash windows/receiver/build-uxplay.sh

      # Starts two receivers side by side, as the app does, and checks both come up and announce
      # themselves on the network. MSYS2 is moved aside first, so the receiver is tried as it runs
      # on a PC without it.
      - name: Try the receiver
        shell: pwsh
        run: |
          $msys = Join-Path $env:RUNNER_TEMP 'msys64'
          if (Test-Path $msys) { Rename-Item $msys 'msys64-aside' }
          try { windows/receiver/smoke-test.ps1 }
          finally { if (Test-Path "$msys-aside") { Rename-Item "$msys-aside" 'msys64' } }

      - uses: actions/upload-artifact@v4
        with:
          name: receiver
          path: windows/receiver/out

  app:
    needs: receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test the stream logic
        run: dotnet test windows/MirrorCore.Tests

      # The OBS feed's sender: Spout2's SpoutDX, wrapped in a small DLL the app calls.
      - name: Build MirrorSpout.dll
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch 2.007.018 https://github.com/leadedge/Spout2 "$env:RUNNER_TEMP\Spout2"
          cmake -S windows/MirrorSpout -B "$env:RUNNER_TEMP\spout-build" -A x64 -DSPOUT_DIR="$env:RUNNER_TEMP\Spout2"
          cmake --build "$env:RUNNER_TEMP\spout-build" --config Release

      - uses: actions/download-artifact@v4
        with:
          name: receiver
          path: windows/dist/MirrorWall/receiver

      - name: Build the app
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $commit = git rev-parse --short HEAD
          $date = git log -1 --format=%cs
          "VERSION=0.$count" >> $env:GITHUB_ENV
          # A beta says so after the number (0.112-beta.7), for Check for Update and About.
          $beta = if ("${{ inputs.beta }}") { "-beta.${{ inputs.beta }}" } else { "" }
          dotnet publish windows/MirrorWall -c Release -r win-x64 --self-contained `
            -p:Version=0.$count -p:InformationalVersion="0.$count$beta+$commit.$date" `
            -p:IncludeSourceRevisionInInformationalVersion=false -o windows/dist/MirrorWall
          Copy-Item "$env:RUNNER_TEMP\spout-build\Release\MirrorSpout.dll" windows/dist/MirrorWall/
          Copy-Item LICENSE windows/dist/MirrorWall/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md "windows/dist/MirrorWall/Licenses and Source Code.txt"
          Copy-Item "$env:RUNNER_TEMP\Spout2\LICENSE" windows/dist/MirrorWall/Spout2-LICENSE.txt
          # The FFmpeg the app is built against (FFmpeg.AutoGen 9) must be the one the receiver brings.
          if (-not (Test-Path windows/dist/MirrorWall/receiver/avcodec-63.dll)) {
            Get-ChildItem windows/dist/MirrorWall/receiver -Filter 'av*.dll' | ForEach-Object Name
            throw "The receiver's FFmpeg isn't version 9 (avcodec-63.dll)"
          }

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" windows/installer/MirrorWall.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # Installs it on the runner to check the firewall rules come out as meant (a typo in a netsh
      # line otherwise only shows up as phones that can't connect).
      - name: Check the installer's firewall rules
        shell: pwsh
        run: |
          $setup = Start-Process windows/dist/MirrorWall-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer failed ($($setup.ExitCode))" }
          $expected = @{
            'Mirror Wall receiver'                 = 'Domain, Private'
            'Mirror Wall Android phones'           = 'Domain, Private'
            'Mirror Wall receiver (Public)'        = 'Public'
            'Mirror Wall Android phones (Public)'  = 'Public'
            'Mirror Wall phone discovery (Public)' = 'Public'
          }
          foreach ($name in $expected.Keys) {
            $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
            if (-not $rule) { throw "No firewall rule '$name'" }
            if ("$($rule.Profile)" -ne $expected[$name]) { throw "'$name' covers $($rule.Profile), not $($expected[$name])" }
            if ($rule.Enabled -ne 'True' -or $rule.Action -ne 'Allow') { throw "'$name' isn't an enabled Allow rule" }
            $address = ($rule | Get-NetFirewallAddressFilter).RemoteAddress
            "$name`: $($rule.Profile), from $address"
            if ($name -like '*(Public)' -and "$address" -ne 'LocalSubnet') { throw "'$name' isn't limited to the local subnet" }
          }
          $uninstaller = Get-ChildItem "${env:ProgramFiles}\Mirror Wall\unins*.exe" | Select-Object -First 1
          # The uninstaller hands over to a copy of itself and returns at once; wait for the folder to go.
          Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "${env:ProgramFiles}\Mirror Wall\MirrorWall.exe"); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          $left = Get-NetFirewallRule -DisplayName 'Mirror Wall*' -ErrorAction SilentlyContinue
          if ($left) { throw "The uninstaller left firewall rules: $($left.DisplayName -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorWall-Setup
          path: windows/dist/MirrorWall-Setup.exe
