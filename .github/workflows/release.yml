# Builds MirrorWall.dmg on a GitHub Mac (UxPlay with this repository's patches, Syphon, the app)
# and, when publishing, the Windows installer (windows.yml) and the Android app (android.yml).
# Run it from the Actions tab (Release › Run workflow) with "Publish" ticked to make a release
# with the DMG, the installer, the APK and the UxPlay source attached; the newest release's
# downloads are always at
# https://github.com/yurtbeer/mirror-wall/releases/latest/download/MirrorWall.dmg,
# https://github.com/yurtbeer/mirror-wall/releases/latest/download/MirrorWall-Setup.exe and
# https://github.com/yurtbeer/mirror-wall/releases/latest/download/MirrorWallCast.apk
# Pull requests that change the Mac app or its packaging build the DMG too (kept as a workflow
# artifact only). Release notes start with the CHANGELOG.md entries new since the last release.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release with the DMG and the Windows installer
        type: boolean
        default: true
      beta:
        description: Publish a test build (pick its branch above) as a pre-release for the Beta update channel
        type: boolean
        default: false
      title:
        description: For a test build, what it's for, as Check for Update lists it (default, the branch's pull request title)
        type: string
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "patches/**"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: read # a test build's title is its pull request's

jobs:
  dmg:
    # The DMG runs on this macOS version or later (its libraries come from this Mac's Homebrew).
    runs-on: macos-26
    env:
      # A beta's number is this workflow's run number (scripts/build-app.sh).
      MIRRORWALL_BETA: ${{ inputs.beta && github.run_number || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Install build tools
        run: brew install cmake pkgconf libplist openssl@3 gstreamer

      - name: Build UxPlay with Mirror Wall's patches
        run: |
          scripts/build-uxplay.sh
          scripts/build-uxplay.sh --source-archive

      - name: Build Syphon
        run: |
          xcodebuild -downloadComponent MetalToolchain
          scripts/build-syphon.sh

      - name: Test
        run: |
          swift test
          bash scripts/tests/test-uxplay-idle.sh build/UxPlay
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # Signing and notarization: with the four secrets below the DMG is signed with the team's
      # Developer ID and notarized, so it opens on any Mac without a warning. Without them it is
      # ad-hoc signed as before (right-click › Open on the first launch).
      #   APPLE_CERTIFICATE_BASE64  the Developer ID Application certificate with its private key,
      #                             exported from Keychain Access as a .p12 and base64-encoded
      #   APPLE_CERTIFICATE_PASSWORD  the .p12's password
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  an Apple ID, its team ID and an
      #                             app-specific password, for notarytool
      - name: Import the signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          if [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials mirrorwall --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
            echo "MIRRORWALL_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          fi

      - name: Build the DMG
        run: |
          scripts/make-dmg.sh
          test -x MirrorWall.app/Contents/Resources/receiver/bin/uxplay
          test -d MirrorWall.app/Contents/Frameworks/Syphon.framework
          cat MirrorWall.app/Contents/Resources/receiver/licenses/README.txt
          codesign -dvv MirrorWall.app 2>&1 | grep -E 'Authority=|flags='
          if security find-identity -v -p codesigning 2>/dev/null | grep -q 'Developer ID Application'; then
            spctl --assess --type execute --verbose=2 MirrorWall.app
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorWall
          path: |
            MirrorWall.dmg
            build/UxPlay-source-*.tar.gz

  windows:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    uses: ./.github/workflows/windows.yml
    with:
      beta: ${{ inputs.beta && format('{0}', github.run_number) || '' }}

  # Betas are for the Mac and Windows apps; Mirror Wall Cast keeps to regular releases.
  android:
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && !inputs.beta)
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [dmg, windows, android]
    # Android is skipped for a beta, which would otherwise skip this too.
    if: >-
      !cancelled() && needs.dmg.result == 'success' && needs.windows.result == 'success'
      && (needs.android.result == 'success' || inputs.beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/download-artifact@v4
        with:
          name: MirrorWall

      - uses: actions/download-artifact@v4
        with:
          name: MirrorWall-Setup

      - if: ${{ !inputs.beta }}
        uses: actions/download-artifact@v4
        with:
          name: MirrorWallCast
          path: android-build

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ inputs.beta && github.run_number || '' }}
          TITLE: ${{ inputs.title }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          if [[ -n "$BETA" ]]; then
            # A test build from a branch: a pre-release, which the download links and the Stable
            # update channel skip, and only Check for Update set to Beta offers.
            TAG="v0.$BUILD-beta.$BETA"
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-beta*' HEAD 2>/dev/null || true)
            { echo "## What's new"; echo; scripts/release-notes.py "$PREVIOUS"
              echo "## Install"; echo
              echo "A test build of Mirror Wall from the \`$GITHUB_REF_NAME\` branch, not a release."
              echo "Install it from Mirror Wall with Settings › General › Updates set to Beta, then Check for Update, and pick it from the list."
              echo "To go back, pick the release from that list, or set Updates to Stable, then Check for Update › Go Back."
              echo "To stop offering it, run Actions › Beta builds › Withdraw."
            } > notes.md
            # Check for Update lists each test build by what follows "Mirror Wall 0.N beta K: ".
            [[ -n "$TITLE" ]] || TITLE=$(gh pr list --head "$GITHUB_REF_NAME" --state all --limit 1 --json title --jq '.[0].title // ""')
            [[ -n "$TITLE" ]] || TITLE=$(git log -1 --format=%s)
            gh release create "$TAG" MirrorWall.dmg MirrorWall-Setup.exe \
              --prerelease --target "$GITHUB_SHA" --title "Mirror Wall 0.$BUILD beta $BETA: $TITLE" --notes-file notes.md
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.$BUILD"
          fi
          # A fixed name, so the newest release's APK is always at …/latest/download/MirrorWallCast.apk.
          cp android-build/MirrorWallCast-*.apk MirrorWallCast.apk
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-beta*' HEAD^ 2>/dev/null || true)
          { echo "## What's new"; echo; scripts/release-notes.py "$PREVIOUS"; } > notes.md
          cat >> notes.md <<'NOTES'
          ## Install

          ### Mac

          **Download [MirrorWall.dmg](https://github.com/${{ github.repository }}/releases/download/TAG/MirrorWall.dmg)**, open it and drag Mirror Wall to Applications.

          The app isn't signed by a registered Apple developer, so the first time you open it macOS blocks it: go to System Settings › Privacy & Security, find the message about Mirror Wall and click **Open Anyway**. This is needed once per Mac. When it asks to find devices on your local network, allow it.

          Needs an Apple Silicon Mac with macOS 26 or later. Then on each iPhone (same Wi-Fi): Control Center › Screen Mirroring › pick "Mirror Wall 1" or another slot.

          ### Windows

          **Download [MirrorWall-Setup.exe](https://github.com/${{ github.repository }}/releases/download/TAG/MirrorWall-Setup.exe)** and run it.

          The installer isn't signed, so Windows SmartScreen may say it protected your PC: click **More info**, then **Run anyway**. It asks for administrator rights to add firewall rules so phones can reach Mirror Wall, on Private and Public networks.

          Needs 64-bit Windows 10 (1809) or Windows 11. Then on each iPhone (same network): Control Center › Screen Mirroring › pick "Mirror Wall 1" or another slot.

          ### Android

          **Download [MirrorWallCast.apk](https://github.com/${{ github.repository }}/releases/download/TAG/MirrorWallCast.apk)** on the phone and install it (allow installing from your browser or file manager when asked), or deploy it with your device management (for example an Intune line-of-business app).

          Mirror Wall Cast shares an Android phone's screen to a Mirror Wall slot. Needs Android 10 or later, on the same network as the Mac or PC. Open it, pick a slot and approve Android's screen-sharing prompt. It's signed with the project's public test key, so each new version installs over the last one.

          ### Licence

          Mirror Wall is free software under the GNU GPL v3. Its receiver is UxPlay; the exact UxPlay source it was built from, with Mirror Wall's patches, is attached below. See "Licenses and Source Code.txt" in the DMG or the Windows install folder.
          NOTES
          sed -i "s/TAG/$TAG/g" notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MirrorWall.dmg MirrorWall-Setup.exe MirrorWallCast.apk build/UxPlay-source-*.tar.gz --clobber
          else
            gh release create "$TAG" MirrorWall.dmg MirrorWall-Setup.exe MirrorWallCast.apk build/UxPlay-source-*.tar.gz \
              --target "$GITHUB_SHA" --title "Mirror Wall ${TAG#v}" --notes-file notes.md
          fi
